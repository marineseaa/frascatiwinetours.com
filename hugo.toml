[[params.steps]]
title = "Choose your experience"
body = "Start with the kind of day you want: a town walk and farmhouse lunch, a hands-on pasta class, or a tasting with a private driver. Compare the meeting point as well as the price. A Rome departure and a Frascati meeting are different bookings."

[[params.steps]]
title = "Check your date and group"
body = "Select your date and everyone travelling, then read the available option\u2019s language, inclusions and cancellation deadline. Tell the operator about dietary or access requirements before committing. The final booking screen is the place to confirm the total for your party."

[[params.steps]]
title = "Keep the confirmation handy"
body = "Save the booking confirmation and read the meeting instructions carefully. For the featured tour, meet outside Frascati station rather than at Roma Termini. Check whether your selected day changes the recommended train, and allow time to find the correct host."

[[params.steps]]
title = "Arrange the journey"
body = "For station-meeting tours, buy your train tickets separately and check the return service. If you chose a private-driver experience, confirm the pickup address and time instead. Keep the rest of the afternoon flexible enough to enjoy the day without rushing back."
