overline: THE FEATURED HALF-DAY
title: From Frascati’s Streets to the Vines
narrative: The advertised experience lasts around four hours. This is its typical
  sequence, with the journey from Rome planned separately; the host sets the pace
  on the day.
stops:
- label: Meet in Frascati
  body: The day begins outside Frascati station, behind the yellow taxi stand. Arrive
    with your confirmation available and meet the host named in your booking. Travelling
    by train from Rome puts you close to the start, but the railway journey is not
    part of the included local transfer.
- label: Get to know the town
  body: Walk through the historic centre with your guide before heading into the countryside.
    A local wine-and-snack stop belongs to this first part of the experience. It is
    a chance to connect the place on the bottle with the streets, food and people
    around you.
- label: Follow the wine to the farmhouse
  body: The operator transfers the group out to the family farmhouse. A visit to the
    vineyard and old cellar shifts the focus from the town to its wine setting. Ask
    about the wines being poured and how the property’s growing and cellar traditions
    shape them.
- label: Taste, compare and sit down for lunch
  body: The farmhouse tasting presents three wines, followed by the chef’s lunch.
    Take time to notice the differences rather than searching for a correct answer.
    The social meal is a substantial part of this format; visitors looking for a cooking
    lesson should choose the separate pasta-masterclass product.
- label: Return to Frascati
  body: The included local transfer takes you back to Frascati station. Keep the return
    train flexible and verify the day’s service before you leave Rome. If you want
    extra time in town, agree arrangements with the host rather than assuming the
    booked transfer can be changed.
