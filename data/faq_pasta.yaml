title: Your Questions, Answered
items:
- question: Are the cooking class and wine tour booked together?
  answer: Yes. This listing includes both, plus lunch and local station transfers.
- question: Which station should I use?
  answer: Frascati is the normal meeting station, but the listing gives a different
    Saturday arrival at Tor Vergata. Confirm the instructions for your booking.
- question: Can dietary requirements be accommodated?
  answer: The listing invites requests for vegetarian, vegan and gluten-free adaptations.
    Get confirmation for your specific needs before booking.
