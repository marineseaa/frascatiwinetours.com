title: Your Questions, Answered
items:
- question: Is transport from Rome included?
  answer: Yes. The listing includes pickup, private-driver transport and drop-off.
    Confirm your address and time with the operator.
- question: Does this include lunch?
  answer: The stated inclusion is snacks paired with wine, not a full lunch.
- question: Will the winery be private?
  answer: The listing specifies a private group and driver, but do not infer exclusive
    use of the winery. Confirm the tasting arrangements with the operator.
